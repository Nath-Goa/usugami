name: Release

# Push a tag like v1.2.0 to build, sign and publish both APKs. The tag must equal "v" + versionName
# in app/build.gradle.kts. A tag with a hyphen (v1.3.0-rc.1) becomes a draft prerelease, which
# never changes the "latest" download links.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Holds USUGAMI_KEYSTORE_BASE64, USUGAMI_KEYSTORE_PASSWORD, USUGAMI_KEY_ALIAS and USUGAMI_KEY_PASSWORD.
    environment: release
    permissions:
      contents: write # create the release and upload assets
      id-token: write # build provenance attestation (Sigstore)
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match versionName
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ] || [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName '$VERSION_NAME' in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: CHANGELOG must have a section for this version
        run: |
          if ! grep -qF "## [$VERSION_NAME]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION_NAME]' section"
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true # clean build from scratch; no cache can leak into a signed release

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.USUGAMI_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret USUGAMI_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "USUGAMI_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build signed APKs
        env:
          USUGAMI_KEYSTORE_PASSWORD: ${{ secrets.USUGAMI_KEYSTORE_PASSWORD }}
          USUGAMI_KEY_ALIAS: ${{ secrets.USUGAMI_KEY_ALIAS }}
          USUGAMI_KEY_PASSWORD: ${{ secrets.USUGAMI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :core:test :app:assembleStandardRelease :app:assembleOfflineRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk dist/Usugami.apk
          cp app/build/outputs/apk/offline/release/app-offline-release.apk dist/Usugami-offline.apk

      - name: Check signer, package and version
        env:
          EXPECTED_CERT_SHA256: ${{ vars.USUGAMI_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': \n' | tr 'A-F' 'a-f')
          [ -n "$expected" ] || { echo "::error::Repository variable USUGAMI_CERT_SHA256 is not set"; exit 1; }
          for apk in dist/Usugami.apk dist/Usugami-offline.apk; do
            "${tools}apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            actual=$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' | sort -u)
            [ "$actual" = "$expected" ] || { echo "::error::$apk is signed by '$actual', expected $expected"; exit 1; }
            "${tools}aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            badging=$(sed -n '1p' "$RUNNER_TEMP/badging.txt")
            echo "$apk: $badging"
            case "$badging" in
              *"name='io.github.nath_goa.usugami'"*"versionName='$VERSION_NAME'"*) ;;
              *) echo "::error::$apk has the wrong package name or versionName (expected $VERSION_NAME)"; exit 1 ;;
            esac
          done

      - name: No network or advertising-ID permissions
        run: bash .github/scripts/check-apk-permissions.sh dist/Usugami.apk dist/Usugami-offline.apk

      - name: Text recognition survives R8
        run: bash .github/scripts/check-mlkit-registrars.sh standardRelease offlineRelease

      - name: Checksums
        run: |
          cd dist
          sha256sum Usugami.apk Usugami-offline.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        env:
          CERT_SHA256: ${{ vars.USUGAMI_CERT_SHA256 }}
        run: |
          set -euo pipefail
          SHA256SUMS="$(cat dist/SHA256SUMS.txt)"
          STANDARD_MB=$(stat -c %s dist/Usugami.apk | awk '{printf "%.1f", $1 / 1000000}')
          OFFLINE_MB=$(stat -c %s dist/Usugami-offline.apk | awk '{printf "%.0f", $1 / 1000000}')
          export SHA256SUMS STANDARD_MB OFFLINE_MB
          {
            awk -v v="$VERSION_NAME" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && /^## / { exit }
              on { print }' CHANGELOG.md
            echo
            envsubst '${TAG} ${GITHUB_REPOSITORY} ${CERT_SHA256} ${SHA256SUMS} ${STANDARD_MB} ${OFFLINE_MB}' \
              < .github/release-notes-template.md
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/Usugami.apk
            dist/Usugami-offline.apk

      # Uploads every file before publishing, so it also works with immutable releases.
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Usugami ${{ env.VERSION_NAME }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/Usugami.apk
            dist/Usugami-offline.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          prerelease: ${{ env.PRERELEASE }}
          draft: ${{ env.PRERELEASE }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
