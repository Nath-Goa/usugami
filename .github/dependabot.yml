version: 2
updates:
  # Pinned action commit SHAs in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Gradle plugins and libraries. After merging an update to a Google library, regenerate
  # third_party/ with tools/google_notices.py and check THIRD_PARTY_NOTICES.md.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ['*']

  # Development-only Python tools (tools/requirements.txt)
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    groups:
      python-tools:
        patterns: ['*']
    ignore:
      # PyMuPDF 2 adds large machine-learning dependencies; stay on 1.x.
      - dependency-name: pymupdf
        update-types: ['version-update:semver-major']
