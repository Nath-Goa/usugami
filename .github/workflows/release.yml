name: Release

# Push a tag like v1.2.0 to build, sign and publish the three APKs (Usugami, Usugami Lite and
# Usugami OCR), and Usugami OCR as an Android App Bundle (Usugami-ocr.aab), the file Google Play
# takes. The tag must equal "v" + versionName in app/build.gradle.kts. A tag with a hyphen
# (v1.3.0-rc.1) becomes a draft prerelease, which never changes the "latest" download links.
#
# Two jobs, so no Gradle plugin, dependency or test ever runs with write access: "build" gets the
# signing key but can only read the repository; "publish" can write releases and attestations but
# runs no build code, only checks the signed files and publishes them.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Holds USUGAMI_KEYSTORE_BASE64, USUGAMI_KEYSTORE_PASSWORD, USUGAMI_KEY_ALIAS and USUGAMI_KEY_PASSWORD.
    environment: release
    permissions:
      contents: read
    outputs:
      version-name: ${{ steps.version.outputs.version-name }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # third_party/ncnn, Usugami OCR's text-recognition engine (not its own submodules)

      - name: Tag must match versionName
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ] || [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName '$VERSION_NAME' in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG must have a section for this version
        run: |
          if ! grep -qF "## [$VERSION_NAME]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION_NAME]' section"
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Usugami OCR's engine is compiled with the NDK and CMake versions pinned in
      # ocr-native/build.gradle.kts; the runner image has other versions.
      - name: Install the NDK and CMake
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true # clean build from scratch; no cache can leak into a signed release

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.USUGAMI_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Secret USUGAMI_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "USUGAMI_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build signed APKs and the app bundle
        env:
          USUGAMI_KEYSTORE_PASSWORD: ${{ secrets.USUGAMI_KEYSTORE_PASSWORD }}
          USUGAMI_KEY_ALIAS: ${{ secrets.USUGAMI_KEY_ALIAS }}
          USUGAMI_KEY_PASSWORD: ${{ secrets.USUGAMI_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --stacktrace :core:test
          :app:assembleStandardRelease :app:assembleLiteRelease :app:assembleOcrRelease
          :app:bundleOcrRelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # The R8 mappings turn obfuscated stack traces from crash reports back into readable ones
      # (retrace mapping.txt trace.txt), so they are published with each release.
      - name: Collect APKs, the app bundle and R8 mappings
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk dist/Usugami.apk
          cp app/build/outputs/apk/lite/release/app-lite-release.apk dist/Usugami-lite.apk
          cp app/build/outputs/apk/ocr/release/app-ocr-release.apk dist/Usugami-ocr.apk
          cp app/build/outputs/bundle/ocrRelease/app-ocr-release.aab dist/Usugami-ocr.aab
          cd app/build/outputs/mapping
          zip -9 -q "$GITHUB_WORKSPACE/dist/mapping-$VERSION_NAME.zip" \
            standardRelease/mapping.txt liteRelease/mapping.txt ocrRelease/mapping.txt

      - name: Check signer, package and version
        env:
          EXPECTED_CERT_SHA256: ${{ vars.USUGAMI_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': \n' | tr 'A-F' 'a-f')
          [ -n "$expected" ] || { echo "::error::Repository variable USUGAMI_CERT_SHA256 is not set"; exit 1; }
          # Usugami and Usugami OCR share a package name; Usugami Lite is an app of its own.
          for entry in dist/Usugami.apk:io.github.nath_goa.usugami \
              dist/Usugami-lite.apk:io.github.nath_goa.usugami.lite \
              dist/Usugami-ocr.apk:io.github.nath_goa.usugami; do
            apk="${entry%%:*}" package="${entry#*:}"
            "${tools}apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            actual=$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' | sort -u)
            [ "$actual" = "$expected" ] || { echo "::error::$apk is signed by '$actual', expected $expected"; exit 1; }
            "${tools}aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            badging=$(sed -n '1p' "$RUNNER_TEMP/badging.txt")
            echo "$apk: $badging"
            case "$badging" in
              *"name='$package'"*"versionName='$VERSION_NAME'"*) ;;
              *) echo "::error::$apk has the wrong package name or versionName (expected $package $VERSION_NAME)"; exit 1 ;;
            esac
          done

      # An app bundle is signed like a JAR file, so the JDK's jarsigner and keytool check its
      # signer. bundletool, Google's tool for app bundles (pinned by its SHA-256), checks the rest.
      - name: Check the app bundle's signer, package and version
        env:
          EXPECTED_CERT_SHA256: ${{ vars.USUGAMI_CERT_SHA256 }}
          BUNDLETOOL_URL: https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          set -euo pipefail
          bundle=dist/Usugami-ocr.aab
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': \n' | tr 'A-F' 'a-f')
          if ! jarsigner -verify "$bundle" > "$RUNNER_TEMP/jarsigner.txt" 2>&1 \
              || ! grep -q '^jar verified\.' "$RUNNER_TEMP/jarsigner.txt" \
              || grep -q 'unsigned entries' "$RUNNER_TEMP/jarsigner.txt"; then
            cat "$RUNNER_TEMP/jarsigner.txt"
            echo "::error::$bundle's signature doesn't verify"; exit 1
          fi
          actual=$(keytool -printcert -jarfile "$bundle" | awk '$1 == "SHA256:" {print $2}' | tr -d ':' | tr 'A-F' 'a-f' | sort -u) || true
          [ "$actual" = "$expected" ] || { echo "::error::$bundle is signed by '$actual', expected $expected"; exit 1; }
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" "$BUNDLETOOL_URL"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c --quiet -
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle" > /dev/null
          manifest() { java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" --xpath="/manifest/@$1"; }
          package=$(manifest package)
          name=$(manifest android:versionName)
          code=$(manifest android:versionCode)
          # The same versionCode as Usugami-ocr.apk, so Play and the APK agree on which is newer.
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          apk_code=$("${tools}aapt2" dump badging dist/Usugami-ocr.apk | sed -n "1s/.*versionCode='\([0-9]*\)'.*/\1/p")
          echo "$bundle: package=$package versionName=$name versionCode=$code"
          if [ "$package" != io.github.nath_goa.usugami ] || [ "$name" != "$VERSION_NAME" ] || [ -z "$code" ] || [ "$code" != "$apk_code" ]; then
            echo "::error::$bundle has the wrong package name or version (expected io.github.nath_goa.usugami $VERSION_NAME $apk_code)"; exit 1
          fi

      - name: No permissions or blocked manifest entries
        run: bash .github/scripts/check-apk-permissions.sh dist/Usugami.apk dist/Usugami-lite.apk dist/Usugami-ocr.apk

      - name: Text recognition survives R8 (Usugami)
        run: bash .github/scripts/check-mlkit-registrars.sh standardRelease

      - name: Native libraries work with 16 KB memory pages
        run: bash .github/scripts/check-16kb-alignment.sh dist/Usugami.apk dist/Usugami-lite.apk dist/Usugami-ocr.apk

      - name: No Google code in Usugami Lite and Usugami OCR
        run: >-
          bash .github/scripts/check-no-google-code.sh
          dist/Usugami-lite.apk app/build/outputs/mapping/liteRelease/mapping.txt
          dist/Usugami-ocr.apk app/build/outputs/mapping/ocrRelease/mapping.txt

      - name: Checksums
        run: |
          cd dist
          sha256sum Usugami.apk Usugami-lite.apk Usugami-ocr.apk Usugami-ocr.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        env:
          CERT_SHA256: ${{ vars.USUGAMI_CERT_SHA256 }}
        run: |
          set -euo pipefail
          SHA256SUMS="$(cat dist/SHA256SUMS.txt)"
          STANDARD_MB=$(stat -c %s dist/Usugami.apk | awk '{printf "%.1f", $1 / 1000000}')
          LITE_MB=$(stat -c %s dist/Usugami-lite.apk | awk '{printf "%.1f", $1 / 1000000}')
          OCR_MB=$(stat -c %s dist/Usugami-ocr.apk | awk '{printf "%.1f", $1 / 1000000}')
          export SHA256SUMS STANDARD_MB LITE_MB OCR_MB
          {
            awk -v v="$VERSION_NAME" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && /^## / { exit }
              on { print }' CHANGELOG.md
            echo
            envsubst '${TAG} ${GITHUB_REPOSITORY} ${CERT_SHA256} ${SHA256SUMS} ${STANDARD_MB} ${LITE_MB} ${OCR_MB}' \
              < .github/release-notes-template.md
          } > dist/release-notes.md
          cat dist/release-notes.md

      # Hands the files to the publish job; kept only briefly, since the release keeps them for good.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # build provenance attestation (Sigstore)
      attestations: write
    env:
      VERSION_NAME: ${{ needs.build.outputs.version-name }}
      PRERELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # Checked again here because this job attests and publishes whatever the build job uploaded.
      # Uses the runner's Android SDK and Java; nothing from the repository runs in this job.
      - name: Check signer, package, version and checksums
        env:
          EXPECTED_CERT_SHA256: ${{ vars.USUGAMI_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': \n' | tr 'A-F' 'a-f')
          [ -n "$expected" ] || { echo "::error::Repository variable USUGAMI_CERT_SHA256 is not set"; exit 1; }
          [ -n "$VERSION_NAME" ] || { echo "::error::The build job did not pass on the versionName"; exit 1; }
          # Usugami and Usugami OCR share a package name; Usugami Lite is an app of its own.
          for entry in dist/Usugami.apk:io.github.nath_goa.usugami \
              dist/Usugami-lite.apk:io.github.nath_goa.usugami.lite \
              dist/Usugami-ocr.apk:io.github.nath_goa.usugami; do
            apk="${entry%%:*}" package="${entry#*:}"
            "${tools}apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            actual=$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' | sort -u)
            [ "$actual" = "$expected" ] || { echo "::error::$apk is signed by '$actual', expected $expected"; exit 1; }
            "${tools}aapt2" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
            badging=$(sed -n '1p' "$RUNNER_TEMP/badging.txt")
            echo "$apk: $badging"
            case "$badging" in
              *"name='$package'"*"versionName='$VERSION_NAME'"*) ;;
              *) echo "::error::$apk has the wrong package name or versionName (expected $package $VERSION_NAME)"; exit 1 ;;
            esac
          done
          # The app bundle is signed like a JAR file, so the JDK checks its signer.
          bundle=dist/Usugami-ocr.aab
          if ! "${JAVA_HOME:?}/bin/jarsigner" -verify "$bundle" > "$RUNNER_TEMP/jarsigner.txt" 2>&1 \
              || ! grep -q '^jar verified\.' "$RUNNER_TEMP/jarsigner.txt" \
              || grep -q 'unsigned entries' "$RUNNER_TEMP/jarsigner.txt"; then
            cat "$RUNNER_TEMP/jarsigner.txt"
            echo "::error::$bundle's signature doesn't verify"; exit 1
          fi
          actual=$("$JAVA_HOME/bin/keytool" -printcert -jarfile "$bundle" | awk '$1 == "SHA256:" {print $2}' | tr -d ':' | tr 'A-F' 'a-f' | sort -u) || true
          [ "$actual" = "$expected" ] || { echo "::error::$bundle is signed by '$actual', expected $expected"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/Usugami.apk
            dist/Usugami-lite.apk
            dist/Usugami-ocr.apk
            dist/Usugami-ocr.aab

      # Uploads every file before publishing, so it also works with immutable releases.
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Usugami ${{ env.VERSION_NAME }}
          body_path: dist/release-notes.md
          files: |
            dist/Usugami.apk
            dist/Usugami-lite.apk
            dist/Usugami-ocr.apk
            dist/Usugami-ocr.aab
            dist/SHA256SUMS.txt
            dist/mapping-${{ env.VERSION_NAME }}.zip
          fail_on_unmatched_files: true
          prerelease: ${{ env.PRERELEASE }}
          draft: ${{ env.PRERELEASE }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
