MaintainerNotes: |-
  Usugami is built in three editions (product flavors). This is "lite": no text recognition, so
  neither the ncnn submodule nor CMake is needed (Gradle still wants the NDK to configure the
  ocr-native module, which only the "ocr" edition uses). The "standard" edition uses Google ML Kit
  and is not built here: its sources and its two com.google.android.gms dependency lines are
  removed, and so are the OCR edition's model files (data the Lite build doesn't use).
  Usugami itself (the "ocr" edition) is io.github.nath_goa.usugami, built from the same repository
  with the recipe in .fdroid.yml there. The store texts are in src/lite/fastlane; the graphics
  they don't replace come from fastlane/ at the repository root.

  Reproducible build: the release workflow (.github/workflows/release.yml) builds and signs
  Usugami-lite.apk on GitHub Actions, and .github/workflows/fdroid.yml rebuilds it from this recipe
  with fdroidserver and compares it with apksigcopier.

